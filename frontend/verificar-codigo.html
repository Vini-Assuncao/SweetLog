<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/build.css">
<title>SweetLog — Verificar Código</title>

</head>
<body>

<div class="auth">
  <div class="auth__art auth__art--bakery-2">
    <div class="auth__art-caption">
      <h3>Gestão Artesanal de Panificação</h3>
      <p>Controle seu estoque com a precisão que sua receita exige.</p>
    </div>
  </div>

  <div class="auth__panel">
    <div class="auth__brand"><span class="logo-dot">🥐</span> SweetLog</div>

    <div class="auth__panel-icon">✉️</div>
    <h1>Verificar Código</h1>
    <p class="subtitle">Enviamos um código de 6 dígitos para o seu telefone.</p>

    <form class="stack gap-16" data-codigo-form novalidate>
      <div class="otp-group">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Dígito 1 do código" autofocus>
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 2 do código">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 3 do código">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 4 do código">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 5 do código">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 6 do código">
      </div>

      <button class="btn btn--primary btn--block btn--lg" type="submit">Verificar →</button>
      <p class="auth__resend">Não recebeu? <a href="#">Reenviar código</a></p>
    </form>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
