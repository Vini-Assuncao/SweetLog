<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SweetLog — Verificar Código</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="auth">
  <div class="auth__art auth__art--bakery-2">
    <div class="auth__art-caption">
      <h3>Gestão Artesanal de Panificação</h3>
      <p>Controle seu estoque com a precisão que sua receita exige.</p>
    </div>
  </div>

  <div class="auth__panel">
    <div class="auth__brand"><span class="logo-dot">🥐</span> SweetLog</div>

    <div class="auth__panel-icon">✉️</div>
    <h1>Verificar Código</h1>
    <p class="subtitle">Enviamos um código de 6 dígitos para o seu telefone.</p>

    <form class="stack gap-16" onsubmit="return false;">
      <div class="otp-group">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1" autofocus>
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1">
      </div>

      <a class="btn btn--primary btn--block btn--lg" href="nova-senha.html">Verificar →</a>
      <p class="auth__resend">Não recebeu? <a href="#">Reenviar código</a></p>
    </form>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
