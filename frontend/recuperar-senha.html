<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/build.css" />
    <title>SweetLog — Recuperar Senha</title>
  </head>
  <body>
    <div class="auth">
      <div class="auth__art auth__art--bakery-1">
        <div class="auth__art-caption">
          <h3>Gestão Artesanal de Panificação</h3>
          <p>Controle seu estoque com a precisão que sua receita exige.</p>
        </div>
      </div>

      <div class="auth__panel">
        <div class="auth__brand"><span class="logo-dot">🥐</span> SweetLog</div>

        <h1>Recuperar Senha</h1>
        <p class="subtitle">
          Insira seu telefone para receber um código de verificação.
        </p>

        <form class="stack gap-16" data-recovery-form novalidate>
          <div class="grupo-campo">
            <label for="telefone">Telefone</label>
            <div class="input-group">
              <span class="icon">📞</span>
              <input
                class="input"
                id="telefone"
                type="tel"
                placeholder="(11) 90000-0000"
              />
            </div>
          </div>

          <button class="btn btn--primary btn--block btn--lg" type="submit">Enviar Código</button>
        </form>
      </div>
    </div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
