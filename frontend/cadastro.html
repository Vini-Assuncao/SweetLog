<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/build.css" />
    <link rel="icon" type="image/png" href="icon.png?v=20261111-2" sizes="50x50" />
    <title>SweetLog — Criar conta</title>
  </head>
  <body>
    <main class="login-wrap">
      <div class="login-card card">
        <div class="login-card__icon" aria-hidden="true"><img src="icon.png" alt="" /></div>
        <h1>Criar conta</h1>
        <p class="subtitle">Use uma matrícula já cadastrada pela sua empresa</p>

        <form class="stack gap-16" data-signup-form>
          <div class="grupo-campo">
            <label for="matricula">Número de matrícula</label>
            <input
              class="input"
              id="matricula"
              name="numero_matricula"
              type="number"
              min="1"
              step="1"
              inputmode="numeric"
              autocomplete="username"
              required
            />
          </div>

          <div class="grupo-campo">
            <label for="nome">Nome completo</label>
            <input
              class="input"
              id="nome"
              name="nome"
              type="text"
              maxlength="100"
              autocomplete="name"
              required
            />
          </div>

          <div class="grupo-campo">
            <label for="telefone">Telefone com DDD</label>
            <input
              class="input"
              id="telefone"
              name="telefone"
              type="tel"
              inputmode="tel"
              autocomplete="tel"
              placeholder="(11) 99999-9999"
              maxlength="16"
              required
            />
            <small>Informe um número de celular com DDD e 11 dígitos.</small>
          </div>

          <div class="grupo-campo">
            <label for="senha">Senha</label>
            <input
              class="input"
              id="senha"
              name="senha"
              type="password"
              minlength="8"
              autocomplete="new-password"
              required
            />
            <small>Use pelo menos 8 caracteres (máximo de 72 bytes).</small>
          </div>

          <div class="grupo-campo">
            <label for="confirma-senha">Confirme a senha</label>
            <input
              class="input"
              id="confirma-senha"
              name="confirma_senha"
              type="password"
              minlength="8"
              autocomplete="new-password"
              required
            />
          </div>

          <button class="btn btn--primary btn--block btn--lg" type="submit">
            Criar conta
          </button>
        </form>

        <div data-signup-success hidden>
          <p data-signup-message role="status"></p>
          <a class="btn btn--primary btn--block" href="login.html">Ir para o login</a>
        </div>

        <p class="login-card__footer">
          Já tem uma conta? <a href="login.html">Entrar</a>
        </p>
      </div>
    </main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
