<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SweetLog — Nova Senha</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="auth">
  <div class="auth__art auth__art--bakery-3"></div>

  <div class="auth__panel">
    <div class="auth__brand"><span class="logo-dot">🥐</span> SweetLog</div>

    <h1>Nova Senha</h1>
    <p class="subtitle">Crie uma senha forte para proteger sua conta.</p>

    <form class="stack gap-16" data-senha-form novalidate>
      <div class="field">
        <label for="nova">Nova Senha</label>
        <div class="input-group">
          <span class="icon">🔒</span>
          <input class="input" id="nova" name="nova" type="password" autocomplete="new-password" minlength="8" placeholder="Mínimo de 8 caracteres" required>
        </div>
      </div>

      <div class="field">
        <label for="confirma">Confirmar Nova Senha</label>
        <div class="input-group">
          <span class="icon">🔒</span>
          <input class="input" id="confirma" name="confirma" type="password" autocomplete="new-password" placeholder="Repita a nova senha" required>
        </div>
      </div>

      <button class="btn btn--primary btn--block btn--lg" type="submit">Redefinir Senha →</button>
    </form>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
