<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/build.css" />
    <title>SweetLog — Nova Senha</title>
  </head>
  <body>
    <div class="auth">
      <div class="auth__art auth__art--bakery-3"></div>

      <div class="auth__panel">
        <div class="auth__brand"><span class="logo-dot">🥐</span> SweetLog</div>

        <h1>Nova Senha</h1>
        <p class="subtitle">Crie uma senha forte para proteger sua conta.</p>

        <form class="stack gap-16" data-reset-form novalidate>
          <div class="grupo-campo">
            <label for="nova">Nova Senha</label>
            <div class="input-group">
              <span class="icon">🔒</span>
              <input
                class="input"
                id="nova"
                type="password"
                placeholder="Mínimo de 8 caracteres"
              />
            </div>
          </div>

          <div class="grupo-campo">
            <label for="confirma">Confirmar Nova Senha</label>
            <div class="input-group">
              <span class="icon">🔒</span>
              <input
                class="input"
                id="confirma"
                type="password"
                placeholder="Repita a nova senha"
              />
            </div>
          </div>

          <button class="btn btn--primary btn--block btn--lg" type="submit">Redefinir Senha →</button>
        </form>
      </div>
    </div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
