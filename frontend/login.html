<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SweetLog — Entrar</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<main class="login-wrap">
  <div class="login-card card">
    <div class="login-card__icon">🥐</div>
    <h1>Bem-vindo(a)</h1>
    <p class="subtitle">Acesse sua conta para iniciar o turno</p>

    <form class="stack gap-16" data-login-form>
      <div class="field">
        <label for="matricula">Número de matrícula</label>
        <div class="input-group">
          <span class="icon">🪪</span>
          <input class="input" id="matricula" type="text" placeholder="Ex: 12345">
        </div>
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <div class="input-group">
          <span class="icon">🔒</span>
          <input class="input" id="senha" type="password" placeholder="••••••••">
        </div>
      </div>

      <div class="login-card__row">
        <label class="remember">
          <input type="checkbox"> Lembrar de mim
        </label>
        <a href="recuperar-senha.html">Esqueci a senha</a>
      </div>

      <button class="btn btn--primary btn--block btn--lg" type="submit">Entrar →</button>
    </form>

    <p class="login-card__footer">Problemas com o acesso? <a href="#">Contate a gerência</a></p>
  </div>
</main>

<script src="js/app.js"></script>
</body>
</html>
